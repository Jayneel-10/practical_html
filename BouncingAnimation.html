<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Loader</title>
    <style>
        .loader div {
            height: 20px;
            width: 20px;
            background-color: rgb(150, 0, 90);
            border-radius: 20%;
            animation: bounce 0.6s alternate infinite;
        }

        .loader div:nth-child(2) {
            animation-delay: 0.1s;
        }

        .loader div:nth-child(3) {
            animation-delay: 0.2s;
        }

        @keyframes bounce {
            to {
                transform: translateY(-40px);
            }
        }

        .loader {
            display: flex;
            justify-content: space-between;
            width: 30%;
            height: 800px;
            align-items: center;
        }
    </style>
</head>

<body>
    <div class="loader">
        <div></div>
        <div></div>
        <div></div>
    </div>
</body>

</html>
